[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tencent-dcta-demo"
version = "0.1.0"
description = "Zero-trust conversational transaction demo for the DBS DCTA challenge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
demo = ["gradio>=4,<7", "cryptography>=42,<51"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["dcta", "dcta.*", "demo_ui", "demo_ui.*"]
exclude = ["demo_ui.tests", "demo_ui.tests.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests", "demo_ui/tests"]
